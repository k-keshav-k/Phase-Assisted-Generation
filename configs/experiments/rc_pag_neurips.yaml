schema_version: 1
seed: 20260729

models:
  llada:
    repository: GSAI-ML/LLaDA-8B-Instruct
    revision: 08b83a6feb34df1a6011b80c3c00c7563e963b07
    dtype: bfloat16
  dream:
    repository: Dream-org/Dream-v0-Instruct-7B
    revision: 05334cb9faaf763692dcf9d8737c642be2b2a6ae
    dtype: bfloat16

datasets:
  gsm8k_train:
    path: openai/gsm8k
    revision: 740312add88f781978c0658806c59bc2815b9866
    split: train
    configs: [main]
  math_train:
    path: EleutherAI/hendrycks_math
    revision: 21a5633873b6a120296cce3e2df9d5550074f4a3
    split: train
    configs: [algebra, counting_and_probability, geometry, intermediate_algebra, number_theory, prealgebra, precalculus]
  mbpp_train:
    path: google-research-datasets/mbpp
    revision: 4bb6404fdc6cacfda99d4ac4205087b89d32030c
    split: train
    configs: [full]
  gsm8k_test:
    path: openai/gsm8k
    revision: 740312add88f781978c0658806c59bc2815b9866
    split: test
    configs: [main]
  math500:
    path: HuggingFaceH4/MATH-500
    revision: 6e4ed1a2a79af7d8630a6b768ec859cb5af4d3be
    split: test
    configs: [default]
  mbpp_sanitized:
    path: google-research-datasets/mbpp
    revision: 4bb6404fdc6cacfda99d4ac4205087b89d32030c
    split: test
    configs: [sanitized]
  humaneval:
    path: openai/openai_humaneval
    revision: 7dce6050a7d6d172f3cc5c32aa97f52fa1a2e544
    split: test
    configs: [openai_humaneval]

# Inclusive ranges in the deterministic, per-pool shuffled order induced by seed.
splits:
  pilot:
    gsm8k_train: [450, 465]
    math_train: [350, 357]
    mbpp_train: [250, 257]
  training:
    gsm8k_train: [0, 299]
    math_train: [0, 199]
    mbpp_train: [0, 99]
  tuning:
    gsm8k_train: [300, 349]
    math_train: [200, 249]
    mbpp_train: [100, 149]
  calibration:
    gsm8k_train: [350, 449]
    math_train: [250, 349]
    mbpp_train: [150, 249]

stage_sizes:
  pilot_per_model: 32
  traces_per_model: 600
  tuning_per_model: 150
  calibration_per_model: 300

policy:
  estimator_kinds: [hist_gradient_boosting, logistic]
  history_window: 4
  candidates:
    - {name: local_t010_p2, variant: rc_pag_local, threshold: 0.010, min_steps: 2, patience: 2}
    - {name: local_t025_p2, variant: rc_pag_local, threshold: 0.025, min_steps: 2, patience: 2}
    - {name: local_t050_p2, variant: rc_pag_local, threshold: 0.050, min_steps: 2, patience: 2}
    - {name: history_t010_p2, variant: rc_pag_history, threshold: 0.010, min_steps: 2, patience: 2}
    - {name: history_t025_p2, variant: rc_pag_history, threshold: 0.025, min_steps: 2, patience: 2}
    - {name: history_t050_p2, variant: rc_pag_history, threshold: 0.050, min_steps: 2, patience: 2}

risk:
  alpha: 0.05
  delta: 0.05
  loss: any_shadow_token_disagreement

statistics:
  bootstrap_samples: 10000
  confidence: 0.95

confirmatory:
  gsm8k_test: 1319
  math500: 500
  mbpp_sanitized: 257
  humaneval: 164

methods:
  development:
    - fixed
    - adablock
    - fast_dllm
    - sched
    - entropy_sum
    - confidence_gate
    - stability_gate
    - constant_budget
    - size_lookup
    - pag
    - residual_pag
    - rc_pag_local
    - rc_pag_history
    - oracle
  confirmatory: [adablock, best_nonlearned, rc_pag_local, rc_pag_history]

claim_gates:
  require_risk_certificate: true
  beat_adablock_both_models: true
  beat_best_nonlearned: true
  minimum_accuracy_lower_ci: -0.02
  require_history_frontier_ci: true
